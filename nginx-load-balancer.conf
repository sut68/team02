# ==========================================
# NGINX LOAD BALANCER CONFIGURATION
# For multi-server deployment with health checks
# ==========================================

# Upstream servers (application instances)
upstream backend_servers {
    # Health check parameters
    # Checks server health every 3 seconds
    # If 5 consecutive checks fail, server marked as down
    server app1.internal:3000 weight=1 max_fails=5 fail_timeout=30s;
    server app2.internal:3000 weight=1 max_fails=5 fail_timeout=30s;
    server app3.internal:3000 weight=1 max_fails=5 fail_timeout=30s;
    
    # Load balancing method: least connections
    least_conn;
    
    # Keep alive connections to upstream
    keepalive 32;
}

# Cache settings for CDN
proxy_cache_path /var/cache/nginx/static levels=1:2 keys_zone=static_cache:100m max_size=1g 
    inactive=60d use_temp_path=off;

proxy_cache_path /var/cache/nginx/dynamic levels=1:2 keys_zone=dynamic_cache:50m max_size=500m 
    inactive=1h use_temp_path=off;

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=100r/s;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=50r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;

# ==========================================
# MAIN SERVER BLOCK
# ==========================================

server {
    listen 80;
    listen [::]:80;
    server_name sut-alumniconnect.me www.sut-alumniconnect.me;
    
    # Redirect HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sut-alumniconnect.me www.sut-alumniconnect.me;
    
    # ==========================================
    # SSL CONFIGURATION
    # ==========================================
    
    ssl_certificate /etc/nginx/certs/sut-alumniconnect.me/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/sut-alumniconnect.me/privkey.pem;
    
    # SSL protocols
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    
    # ==========================================
    # LOGGING
    # ==========================================
    
    access_log /var/log/nginx/access.log combined buffer=32k flush=5s;
    error_log /var/log/nginx/error.log warn;
    
    # Log slow requests (> 1 second)
    set $request_time_start $msec;
    
    # ==========================================
    # STATIC ASSETS (CACHE LONG-TERM)
    # ==========================================
    
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_cache static_cache;
        proxy_cache_valid 200 60d;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        
        # Add cache status header for debugging
        add_header X-Cache-Status $upstream_cache_status;
        add_header Cache-Control "public, max-age=31536000, immutable";
        
        expires 365d;
        proxy_pass http://backend_servers;
        
        # Don't cache if backend returns no-cache
        proxy_no_cache $http_pragma $http_authorization;
        
        # Upstream configuration
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
    
    # ==========================================
    # UPLOADS (CACHE MEDIUM-TERM)
    # ==========================================
    
    location /uploads/ {
        proxy_cache static_cache;
        proxy_cache_valid 200 24h;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        
        add_header X-Cache-Status $upstream_cache_status;
        add_header Cache-Control "public, max-age=86400";
        
        expires 1d;
        proxy_pass http://backend_servers;
        
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
    
    # ==========================================
    # DYNAMIC CONTENT (SHORT CACHE)
    # ==========================================
    
    location / {
        # Rate limiting
        limit_req zone=general_limit burst=20 nodelay;
        
        # Proxy configuration
        proxy_pass http://backend_servers;
        proxy_http_version 1.1;
        
        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        
        # Connection settings
        proxy_set_header Connection "";
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        
        # Buffering
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 24 4k;
        proxy_busy_buffers_size 8k;
        
        # Keep alive
        keepalive_timeout 30s;
    }
    
    # ==========================================
    # API ENDPOINTS (STRICT RATE LIMIT)
    # ==========================================
    
    location /api/ {
        limit_req zone=api_limit burst=10 nodelay;
        
        # Don't cache API responses
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        
        proxy_pass http://backend_servers;
        proxy_http_version 1.1;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        
        proxy_set_header Connection "";
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
    
    # ==========================================
    # AUTHENTICATION ENDPOINTS (VERY STRICT)
    # ==========================================
    
    location ~ ^/(api/auth|auth/) {
        limit_req zone=auth_limit burst=2 nodelay;
        limit_req_status 429;
        
        proxy_pass http://backend_servers;
        proxy_http_version 1.1;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        
        proxy_set_header Connection "";
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
    
    # ==========================================
    # HEALTH CHECK ENDPOINT (NO RATE LIMIT)
    # ==========================================
    
    location /api/health {
        access_log off;
        proxy_pass http://backend_servers;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        
        # Quick timeout for health checks
        proxy_connect_timeout 5s;
        proxy_read_timeout 5s;
    }
    
    # ==========================================
    # MONITORING & STATUS
    # ==========================================
    
    location /nginx_status {
        stub_status;
        access_log off;
        allow 127.0.0.1;
        allow 10.0.0.0/8;    # Internal network
        deny all;
    }
}

# ==========================================
# UPSTREAM BACKUP SERVER (FAILOVER)
# ==========================================

server {
    listen 443 ssl http2;
    server_name sut-alumniconnect.me www.sut-alumniconnect.me;
    
    ssl_certificate /etc/nginx/certs/sut-alumniconnect.me/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/sut-alumniconnect.me/privkey.pem;
    
    # This block handles failover when all backend servers are down
    location / {
        root /var/www/maintenance;
        try_files /index.html =503;
        error_page 503 /index.html;
    }
}