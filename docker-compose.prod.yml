version: "3.9"

services:
  # ============================================
  # Database
  # ============================================
  db:
    image: postgres:16-alpine
    container_name: next-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: mydb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # ============================================
  # Nginx Proxy
  # ============================================
  nginx-proxy:
    image: jwilder/nginx-proxy:latest
    container_name: nginx-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # เปลี่ยนมาใช้ Named Volume เพื่อความชัวร์ว่าไฟล์ไม่หาย
      - certs:/etc/nginx/certs:ro
      - vhost:/etc/nginx/vhost.d
      - html:/usr/share/nginx/html
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - ./config/client_max_body_size.conf:/etc/nginx/conf.d/client_max_body_size.conf
    restart: always
    networks:
      - app-network
    depends_on:
      - db

  nginx-proxy-letsencrypt:
    image: jrcs/letsencrypt-nginx-proxy-companion:latest
    container_name: nginx-proxy-letsencrypt
    depends_on:
      - nginx-proxy
    volumes:
      # ใช้ Volume ชุดเดียวกันกับตัวข้างบน
      - certs:/etc/nginx/certs:rw
      - vhost:/etc/nginx/vhost.d
      - html:/usr/share/nginx/html
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      DEFAULT_EMAIL: sutalumniconnect@gmail.com
      NGINX_PROXY_CONTAINER: nginx-proxy
      
      # [TIPS] ถ้าช่วงนี้ Test บ่อย ให้เปิดบรรทัดนี้ เพื่อใช้ Staging (ไม่ติด Limit)
      # พอชัวร์แล้วค่อยลบออกเพื่อเอาใบจริง
      # ACME_CA_URI: https://acme-staging-v02.api.letsencrypt.org/directory
    restart: always
    networks:
      - app-network

  # ============================================
  # Backend API
  # ============================================
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: api
    # ตัด npx prisma migrate resolve ออก เพราะไม่ควร run ทุกครั้งที่ start (ใช้ deploy ก็พอ)
    command: >
      sh -c "npx prisma migrate deploy && npm run start"
    expose:
      - "3000"
    environment:
      VIRTUAL_HOST: api.sut-alumniconnect.me
      LETSENCRYPT_HOST: api.sut-alumniconnect.me
      VIRTUAL_PORT: 3000
      PORT: 3000
      DATABASE_URL: postgres://postgres:postgres@db:5432/mydb
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    restart: always
    networks:
      - app-network
    env_file:
      - .env

  # ============================================
  # Frontend
  # ============================================
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: web
    expose:
      - "3000"
    environment:
      # ตรวจสอบชื่อ Domain ตรงนี้ให้ดี ถ้าชื่อผิด หรือเปลี่ยนไปมา มันจะขอใหม่ตลอด
      # .me เฉยๆ เป็น TLD ใช้ไม่ได้ ต้องเป็น yourdomain.me
      VIRTUAL_HOST: www.sut-alumniconnect.me,sut-alumniconnect.me
      LETSENCRYPT_HOST: www.sut-alumniconnect.me,sut-alumniconnect.me
      VIRTUAL_PORT: 3000
      NEXT_PUBLIC_API_URL: https://api.sut-alumniconnect.me
      API_URL: http://api:3000
      NODE_ENV: production
    depends_on:
      - api
      - db
    restart: always
    networks:
      - app-network
    env_file:
      - .env

# ============================================
# ประกาศ Volume ให้เป็นแบบถาวร (Named Volumes)
# ============================================
volumes:
  db_data:
  certs:  # เก็บ Certificate ไว้ที่นี่ (Docker จัดการให้)
  vhost:  # เก็บ Config vhost
  html:   # เก็บไฟล์ challenge สำหรับยืนยันตัวตน

networks:
  app-network:
    driver: bridge