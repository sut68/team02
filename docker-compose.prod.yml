version: "3.9"

services:
  # ============================================
  # Database
  # ============================================
  db:
    image: postgres:16-alpine
    container_name: next-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: mydb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # ============================================
  # Nginx Proxy (ประตูหน้าบ้าน)
  # ============================================
  nginx-proxy:
    image: jwilder/nginx-proxy:latest
    container_name: nginx-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx-data/certs:/etc/nginx/certs:ro
      - ./nginx-data/vhost.d:/etc/nginx/vhost.d
      - ./nginx-data/html:/usr/share/nginx/html
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - ./config/client_max_body_size.conf:/etc/nginx/conf.d/client_max_body_size.conf
    restart: always
    networks:
      - app-network
    depends_on:
      - db

  nginx-proxy-letsencrypt:
    image: jrcs/letsencrypt-nginx-proxy-companion:latest
    container_name: nginx-proxy-letsencrypt
    depends_on:
      - nginx-proxy
    volumes:
      - ./nginx-data/certs:/etc/nginx/certs:rw
      - ./nginx-data/vhost.d:/etc/nginx/vhost.d
      - ./nginx-data/html:/usr/share/nginx/html
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      DEFAULT_EMAIL: sutalumniconnect@gmail.com
      NGINX_PROXY_CONTAINER: nginx-proxy
    restart: always
    networks:
      - app-network

  # ============================================
  # Backend API (Node.js)
  # ============================================
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: api
    expose:
      - "3000"  # ✅ เปิดพอร์ต 3000 แค่ภายใน (ไม่ให้ชนกับ web ข้างนอก)
    environment:
      # ให้ Nginx ส่งคนเข้า api.sut... มาที่นี่
      VIRTUAL_HOST: api.sut-alumniconnect.me
      LETSENCRYPT_HOST: api.sut-alumniconnect.me
      VIRTUAL_PORT: 3000
      
      PORT: 3000
      DATABASE_URL: postgres://postgres:postgres@db:5432/mydb
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    restart: always
    networks:
      - app-network
    env_file:
      - .env

  # ============================================
  # Frontend (Next.js)
  # ============================================
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: web
    expose:
      - "3000"
    environment:
      VIRTUAL_HOST: www.sut-alumniconnect.me,sut-alumniconnect.me
      LETSENCRYPT_HOST: www.sut-alumniconnect.me,sut-alumniconnect.me
      VIRTUAL_PORT: 3000
      
      # บอก Frontend ว่า API อยู่ที่ไหน (URL จริง)
      NEXT_PUBLIC_API_URL: https://api.sut-alumniconnect.me
      
      # บอก Server Next.js ให้คุยกับ API ผ่าน Docker Network (Internal)
      API_URL: http://api:3000
      
      NODE_ENV: production
    depends_on:
      - api
      - db
    restart: always
    networks:
      - app-network
    env_file:
      - .env

volumes:
  db_data:

networks:
  app-network:
    driver: bridge