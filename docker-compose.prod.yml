version: "3.9"

services:
  # ============================================
  # PostgreSQL Database
  # ============================================
  db:
    image: postgres:16-alpine
    container_name: next-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: mydb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # ============================================
  # Reverse Proxy (Nginx)
  # ============================================
  nginx-proxy:
    image: jwilder/nginx-proxy:latest
    container_name: nginx-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx-data/certs:/etc/nginx/certs:ro
      - ./nginx-data/vhost.d:/etc/nginx/vhost.d
      - ./nginx-data/html:/usr/share/nginx/html
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - ./config/client_max_body_size.conf:/etc/nginx/conf.d/client_max_body_size.conf
    restart: always
    networks:
      - app-network
    depends_on:
      - db

  nginx-proxy-letsencrypt:
    image: jrcs/letsencrypt-nginx-proxy-companion:latest
    container_name: nginx-proxy-letsencrypt
    depends_on:
      - nginx-proxy
    volumes:
      - ./nginx-data/certs:/etc/nginx/certs:rw
      - ./nginx-data/vhost.d:/etc/nginx/vhost.d
      - ./nginx-data/html:/usr/share/nginx/html
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      DEFAULT_EMAIL: sutalumniconnect@gmail.com
      NGINX_PROXY_CONTAINER: nginx-proxy
    restart: always
    networks:
      - app-network

  # ============================================
  # Web Application (Frontend + API in one)
  # ============================================
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: web
    expose:
      - "3000"
    environment:
      # 👇 ใส่ domain ทั้งหมดที่นี่ (ทั้ง www และ api)
      VIRTUAL_HOST: www.sut-alumniconnect.me,sut-alumniconnect.me,api.sut-alumniconnect.me
      LETSENCRYPT_HOST: www.sut-alumniconnect.me,sut-alumniconnect.me,api.sut-alumniconnect.me
      VIRTUAL_PORT: 3000
      
      # URL ภายนอกที่ Browser จะเรียก (ชี้ไปที่โดเมน api หรือ www ก็ได้)
      NEXT_PUBLIC_API_URL: https://www.sut-alumniconnect.me/api
      
      # Database Connection (Web ต่อ DB โดยตรง)
      DATABASE_URL: postgres://postgres:postgres@db:5432/mydb
      
      NODE_ENV: production
    depends_on:
      - db
    restart: always
    networks:
      - app-network
    env_file:
      - .env

volumes:
  db_data:

networks:
  app-network:
    driver: bridge