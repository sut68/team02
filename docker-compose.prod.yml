version: "3.9"

services:
  # ============================================
  # PostgreSQL Database
  # ============================================
  db:
    image: postgres:16-alpine
    container_name: next-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: mydb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    # ports:  <-- ลบทิ้งใน Prod เพื่อความปลอดภัย (ให้คุยกันแค่ใน Docker Network พอ)
    #   - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # ============================================
  # Reverse Proxy (Nginx)
  # ============================================
  nginx-proxy:
    image: jwilder/nginx-proxy:latest
    container_name: nginx-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # 👇 แก้: ใช้ Path จริง เพื่อกัน Cert หาย
      - ./nginx-data/certs:/etc/nginx/certs:ro
      - ./nginx-data/vhost.d:/etc/nginx/vhost.d
      - ./nginx-data/html:/usr/share/nginx/html
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - ./config/client_max_body_size.conf:/etc/nginx/conf.d/client_max_body_size.conf
    restart: always
    networks:
      - app-network
    depends_on:
      - db

  nginx-proxy-letsencrypt:
    image: jrcs/letsencrypt-nginx-proxy-companion:latest
    container_name: nginx-proxy-letsencrypt
    depends_on:
      - nginx-proxy
    volumes:
      # 👇 แก้: ใช้ Path จริง (ต้องตรงกับ nginx-proxy)
      - ./nginx-data/certs:/etc/nginx/certs:rw
      - ./nginx-data/vhost.d:/etc/nginx/vhost.d
      - ./nginx-data/html:/usr/share/nginx/html
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      DEFAULT_EMAIL: sutalumniconnect@gmail.com
      NGINX_PROXY_CONTAINER: nginx-proxy
    restart: always
    networks:
      - app-network

  # ============================================
  # Backend API
  # ============================================
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: api
    expose:
      - "3000" # ปกติ NestJS/Express มักรันที่ 3000 (เช็คใน code อีกทีนะครับ)
    environment:
      VIRTUAL_HOST: api.sut-alumniconnect.me
      LETSENCRYPT_HOST: api.sut-alumniconnect.me
      VIRTUAL_PORT: 3000 # ต้องตรงกับ Port ที่ Code คุณรัน (ผมแก้เป็น 3000 ตามมาตรฐาน)
      PORT: 3000         # บังคับให้ App รันที่ Port 3000
      DATABASE_URL: postgres://postgres:postgres@db:5432/mydb
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    restart: always
    networks:
      - app-network
    env_file:
      - .env
    # ลบ ports: "3000:3000" ออก เพราะ Nginx จัดการให้แล้ว

  # ============================================
  # Frontend
  # ============================================
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: web
    expose:
      - "3000"
    environment:
      VIRTUAL_HOST: www.sut-alumniconnect.me,sut-alumniconnect.me
      LETSENCRYPT_HOST: www.sut-alumniconnect.me,sut-alumniconnect.me
      VIRTUAL_PORT: 3000
      
      # 👇 สำคัญมาก: อันนี้คือ URL ที่ Browser ลูกค้าจะยิงไปหา
      NEXT_PUBLIC_API_URL: https://api.sut-alumniconnect.me
      
      # 👇 อันนี้คือ URL ที่ Server Next.js จะยิงไปหา (Internal Docker)
      API_URL: http://api:3000
      
      NODE_ENV: production
    depends_on:
      - api
      - db
    restart: always
    networks:
      - app-network
    env_file:
      - .env
    # ลบ ports: "3000:3000" ออก ป้องกัน Port ชนกัน

volumes:
  db_data:
  # certs: <-- ลบออกได้เลยเพราะใช้ Host Path แทนแล้ว

networks:
  app-network:
    driver: bridge