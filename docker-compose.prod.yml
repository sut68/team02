version: "3.9"

services:
  # ============================================
  # PostgreSQL Database
  # ============================================
  db:
    image: postgres:16-alpine
    container_name: next-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: mydb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # ============================================
  # Reverse Proxy (Nginx)
  # ============================================
  nginx-proxy:
    image: jwilder/nginx-proxy:latest
    container_name: nginx-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - certs:/etc/nginx/certs:ro
      - /etc/nginx/vhost.d
      - /usr/share/nginx/html
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - ./config/client_max_body_size.conf:/etc/nginx/conf.d/client_max_body_size.conf
    restart: always
    networks:
      - app-network
    depends_on:
      - db

  nginx-proxy-letsencrypt:
    image: jrcs/letsencrypt-nginx-proxy-companion:latest
    container_name: nginx-proxy-letsencrypt
    depends_on:
      - nginx-proxy
    volumes:
      - certs:/etc/nginx/certs:rw
      - /etc/nginx/vhost.d
      - /usr/share/nginx/html
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      DEFAULT_EMAIL: sutalumniconnect@gmail.com
      NGINX_PROXY_CONTAINER: nginx-proxy
    restart: always
    networks:
      - app-network

  # ============================================
  # Backend API
  # ============================================
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: api
    expose:
      - "8000"
    ports:
      - "3000:3000"
    environment:
      VIRTUAL_HOST: api.sut-alumniconnect.me
      LETSENCRYPT_HOST: api.sut-alumniconnect.me
      VIRTUAL_PORT: 8000
      DATABASE_URL: postgres://postgres:postgres@db:5432/mydb
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    restart: always
    networks:
      - app-network
    env_file:
      - .env
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  # ============================================
  # Frontend
  # ============================================
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: web
    expose:
      - "3000"
    ports:
      - "3000:3000"

    environment:
      VIRTUAL_HOST: www.sut-alumniconnect.me
      LETSENCRYPT_HOST: www.sut-alumniconnect.me
      NEXT_PUBLIC_API_URL: http://api:8000
      API_URL: http://api:8000
      NODE_ENV: production
    depends_on:
      - api
      - db
    restart: always
    networks:
      - app-network
    env_file:
      - .env
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

volumes:
  db_data:
  certs:

networks:
  app-network:
    driver: bridge
