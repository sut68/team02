name: Build and Deploy to Azure

on:
  push:
    branches:
      - main
      - develop
      - ci/github-actions
  pull_request:
    branches:
      - main
      - develop

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  quality-check:
    uses: ./.github/workflows/tests.yml
    secrets: inherit # ส่งความลับไปให้ test ใช้ด้วย (ถ้าจำเป็น)

  build:
    needs: quality-check # สั่งให้รอ Test ผ่านก่อนถึงจะเริ่ม Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile.api
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-api:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-api:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push Web image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile.web
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-web:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-web:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  deploy:
    needs: build # รอ Build เสร็จค่อย Deploy
    runs-on: ubuntu-latest
    # Deploy เฉพาะตอน Push เข้า Main เท่านั้น
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Deploy to Azure VM
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.AZURE_VM_IP }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          command_timeout: 20m  # เพิ่มเวลาทำงานเป็น 20 นาที เพื่อป้องกัน Timeout ตอน Pull
          script: |
            cd /opt/alumni-connect
            
            # 1. แก้ไขสิทธิ์ Git ทันที (ใส่ sudo เพื่อความชัวร์ในระดับ System)
            git config --global --add safe.directory /opt/alumni-connect
            
            # 2. ล้างระบบ Docker ให้สะอาดที่สุดเพื่อคืนพื้นที่
            docker system prune -af
            
            # 3. อัปเดตโค้ด (ถ้าติด dubious ownership ตรงนี้จะข้ามไปทำงานส่วนอื่นต่อได้)
            git pull origin main || true 
            
            # 4. Login และจัดการ Container
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose pull --quiet # เพิ่ม --quiet เพื่อลดปริมาณ Log และลดโอกาสค้าง
            docker compose up -d --force-recreate
            
            # 5. แก้ไขสถานะ Migration (จุดประสงค์หลักของเรา)
            docker compose exec -T api npx prisma migrate resolve --applied 20251224031927_y || true
            docker compose exec -T api npx prisma migrate deploy

      - name: Run health check
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.AZURE_VM_IP }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          script: |
            cd /opt/alumni-connect
            ./scripts/health-check.sh