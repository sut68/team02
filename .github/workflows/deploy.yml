name: Build and Deploy to Azure

on:
  push:
    branches:
      - main
      - develop
      - ci/github-actions
  pull_request:
    branches:
      - main
      - develop

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  quality-check:
    uses: ./.github/workflows/tests.yml
    secrets: inherit

  build:
    needs: quality-check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile.api
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-api:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-api:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push Web image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile.web
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-web:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-web:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Deploy เฉพาะตอน Push เข้า Main เท่านั้น
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Deploy to Azure VM
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.AZURE_VM_IP }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          command_timeout: 20m
          script: |
            # 1. เข้าไปที่โฟลเดอร์โปรเจกต์
            cd ~/team02 || exit 1
            
            # 2. แก้ปัญหา Git Permission (ใช้ Token ดึงโค้ด)
            git remote set-url origin https://oauth2:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
            git fetch origin main
            git reset --hard origin/main
            
            # 3. Login Container Registry
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # 4. Pull Image (ใช้ docker compose แบบไม่มีขีด)
            docker compose -f docker-compose.prod.yml pull
            
            # 5. สั่งหยุดของเก่า (ใช้ docker compose แบบไม่มีขีด)
            docker compose -f docker-compose.prod.yml down || true
            
            # 6. คืนพื้นที่ Disk
            docker system prune -af
            
            # 7. รันระบบใหม่ (ใช้ docker compose แบบไม่มีขีด)
            docker compose -f docker-compose.prod.yml up -d --force-recreate
            
            # 8. รอและสั่ง Migration
            echo "Waiting for database..."
            sleep 60
            docker compose -f docker-compose.prod.yml exec -T api npx prisma migrate deploy

      - name: Run health check
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.AZURE_VM_IP }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          script: |
            sleep 30
            chmod +x ~/team02/scripts/health-check.sh
            ~/team02/scripts/health-check.sh