name: Build and Deploy to Azure

on:
  push:
    branches:
      - main
      - develop
      - ci/github-actions
  pull_request:
    branches:
      - main
      - develop

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  quality-check:
    uses: ./.github/workflows/tests.yml
    secrets: inherit

  build:
    needs: quality-check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile.api
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-api:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-api:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push Web image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile.web
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-web:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-web:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Deploy เฉพาะตอน Push เข้า Main เท่านั้น
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Deploy to Azure VM
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.AZURE_VM_IP }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          command_timeout: 20m
          script: |
            # 1. เข้าไปที่โฟลเดอร์โปรเจกต์ (ใช้ Path ของ user จริง)
            cd ~/team02 || exit 1
            
            # 2. ดึง Code ล่าสุด (เพื่อให้ได้ไฟล์ docker-compose.prod.yml ที่แก้แล้ว)
            git fetch origin main
            git reset --hard origin/main
            
            # 3. Login เข้า Container Registry
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # 4. Pull Image ล่าสุด
            docker-compose -f docker-compose.prod.yml pull
            
            # 5. สั่งหยุดของเก่าก่อน (สำคัญมาก! เพื่อเคลียร์ Port 3000 ที่ค้างอยู่)
            docker-compose -f docker-compose.prod.yml down || true
            
            # 6. (Optional) คืนพื้นที่ Disk
            docker system prune -af
            
            # 7. รันระบบใหม่ (ระบุชื่อไฟล์ .prod.yml)
            docker-compose -f docker-compose.prod.yml up -d --force-recreate
            
            # 8. รอให้ Database พร้อม แล้วสั่ง Migration
            echo "Waiting for database..."
            sleep 15
            docker-compose -f docker-compose.prod.yml exec -T api npx prisma migrate deploy

      - name: Run health check
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.AZURE_VM_IP }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          script: |
            sleep 30
            
            # ให้สิทธิ์ execute ไฟล์ script
            chmod +x ~/team02/scripts/health-check.sh
            
            # รัน script ตรวจสอบสถานะ
            echo "Running Health Check..."
            ~/team02/scripts/health-check.sh